plugins {
	alias(libs.plugins.android.library)
	id 'maven-publish'
}

// Single source of truth for the library version (BuildConfig, default User-Agent and publication)
def knHttpVersion = '5.0.1'
// JitPack publishes the requested tag, commit or branch: it passes it with -Pversion
def publicationVersion = project.version.toString() in ['', 'unspecified'] ? knHttpVersion : project.version.toString()

android {
	namespace = 'ovh.karewan.knhttp'
	compileSdk = 37

	defaultConfig {
		minSdk = 21
		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
		consumerProguardFiles 'proguard-rules.pro'
		buildConfigField 'String', 'VERSION_NAME', "\"${knHttpVersion}\""
	}

	buildFeatures {
		buildConfig = true
	}

	buildTypes {
		release {
			minifyEnabled = false
		}
	}

	lint {
		abortOnError = false
		targetSdk = 37
	}

	testOptions {
		targetSdk = 37
		unitTests {
			includeAndroidResources = true
			all {
				maxHeapSize = '2g'
				// Robolectric (SDK 36) on recent JDKs
				jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED', '--enable-native-access=ALL-UNNAMED'
			}
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	publishing {
		singleVariant('release') {
			withSourcesJar()
		}
	}
}

dependencies {
	implementation(platform(libs.kotlin.bom))
	// Annotations used by the public API (@NonNull, @RestrictTo...)
	api(libs.androidx.annotation)
	// OkHttpInitializer
	implementation(libs.androidx.startup.runtime)
	implementation(libs.conscrypt.android)
	api(libs.okio)
	api(libs.okhttp)
	implementation(libs.okhttp.brotli)
	api(libs.fastjson2)

	testImplementation(libs.junit)
	testImplementation(libs.robolectric)
	testImplementation(libs.androidx.test.core)
	testImplementation(libs.androidx.test.ext.junit)
	testImplementation(libs.okhttp.mockwebserver)
	testImplementation(libs.okhttp.tls)
	// JVM build of Conscrypt (same version) for the unit tests, the Android one can't load on the JVM
	testImplementation(libs.conscrypt.openjdk.uber)

	// Real devices: ./gradlew :knhttp:connectedDebugAndroidTest
	androidTestImplementation(libs.junit)
	androidTestImplementation(libs.androidx.test.runner)
	androidTestImplementation(libs.androidx.test.ext.junit)
}

configurations.configureEach {
	if (name.endsWith('UnitTestRuntimeClasspath') || name.endsWith('UnitTestCompileClasspath')) {
		exclude group: 'org.conscrypt', module: 'conscrypt-android'
	}
}

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				from components.release
				groupId = 'com.github.Karewan'
				artifactId = 'KnHttp'
				version = publicationVersion
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
