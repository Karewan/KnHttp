plugins {
	id 'com.android.library'
	id 'maven-publish'
}

android {
	namespace 'ovh.karewan.knhttp'
	compileSdk = 37

	defaultConfig {
		minSdk 21
		targetSdk 37
		consumerProguardFiles 'proguard-rules.pro'
		buildConfigField("String", "VERSION_NAME", "\"4.0.2\"")
	}

	buildFeatures {
		buildConfig = true
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	lintOptions {
		abortOnError false
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_21
		targetCompatibility JavaVersion.VERSION_21
	}

	publishing {
		singleVariant("release")
	}
}

dependencies {
	implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.3.21"))
	implementation 'androidx.annotation:annotation:1.10.0'
	implementation 'org.conscrypt:conscrypt-android:2.6.1'
	api 'com.squareup.okio:okio:3.18.1'
	api ('com.squareup.okhttp3:okhttp:5.4.0') {
		exclude group: 'com.squareup.okio', module:'okio'
		exclude group: 'com.squareup.okio', module:'okio-jvm'
	}
	implementation 'com.squareup.okhttp3:okhttp-brotli:5.4.0'
	api 'com.alibaba.fastjson2:fastjson2:2.0.61.android5'
}

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				from components.release
				groupId = 'com.github.Karewan'
				artifactId = 'KnHttp'
				version = android.defaultConfig.versionName
			}
		}
	}
}
